name: Codebranch reviewer checklist
description: >-
  Posts the reviewer checklist on a pull request and reports a reviewer-checklist
  commit status that fails until every item is ticked or marked N/A with a reason.

inputs:
  github-token:
    description: Token used to comment and set the commit status.
    default: ${{ github.token }}
  reset-on-push:
    description: >-
      Reset the checklist to unticked whenever new commits are pushed, so the
      review always covers the head commit. Set 'false' to keep ticks across
      pushes; the status then certifies a review happened, not that it covered
      the final commit.
    default: 'true'
  reviewer-logins:
    description: >-
      Comma- or space-separated logins allowed to fill in the checklist, such as
      the account a CI-run review agent edits with. An edit by any other account
      resets the checklist, as an edit by the PR author always does. Empty means
      anyone but the PR author may fill it in.
    default: ''
  signing-key:
    description: >-
      Secret used to sign the head commit recorded in the checklist comment, so
      nobody can pre-set it to a commit they are about to push and skip the reset.
      Pass a repository secret, for example secrets.REVIEWER_CHECKLIST_KEY. Empty
      leaves the line unsigned.
    default: ''
  # The three below are facts about the CONSUMING repository, not about the
  # checklist, so they are inputs rather than constants in src/main.js. The
  # defaults are what every repository got before they existed, so nothing
  # changes for a consumer that sets none of them.
  status-context:
    description: >-
      Name of the commit status this action reports, and therefore the context to
      make required in branch protection. Override it to namespace the gate the way
      the repository names its other contexts (for example review/checklist), to
      avoid colliding with an existing context of the same name, or to run two
      checklists in one repository.
    default: reviewer-checklist
  bot-login:
    description: >-
      Login that owns the checklist comment. It must match the identity
      github-token resolves to: the default GITHUB_TOKEN comments as
      github-actions[bot], a GitHub App installation token as <app-slug>[bot], and
      a personal access token as the user who owns it. A value that does not match
      makes the action unable to find the comment it posted, so it posts a new
      unticked checklist on every event and the status can never go green.
    default: github-actions[bot]
  config-path:
    description: >-
      Path, in the consuming repository's default branch, to the per-repository
      settings file (in-this-repo, not-applicable and extra-items). Read from the
      DEFAULT BRANCH, never from the pull request: extra items read from the head
      could be deleted by the very pull request they were written to catch.
    default: .github/reviewer-checklist.yml
  checklist-repo:
    description: >-
      Repository whose CHECKLIST.md supplies the checklist text, read at run time
      from its default branch. Leave it alone unless a fork owns the shared
      checklist: the point of reading it live is that editing the checklist in one
      place updates every consumer without re-pinning this action.
    default: Codebranch-LLC/codebranch-pr-reviewer-checklist
  checklist-ref:
    description: >-
      Ref to read CHECKLIST.md from. Empty means that repository's default branch,
      which is what keeps every consumer on the latest checklist. A branch or tag
      name freezes the text at that ref; the literal value "pinned" uses the copy
      baked in at this action's pinned SHA and makes no API call.
    default: ''

runs:
  using: composite
  steps:
    - uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
      env:
        ACTION_PATH: ${{ github.action_path }}
        RESET_ON_PUSH: ${{ inputs.reset-on-push }}
        REVIEWER_LOGINS: ${{ inputs.reviewer-logins }}
        SIGNING_KEY: ${{ inputs.signing-key }}
        STATUS_CONTEXT: ${{ inputs.status-context }}
        BOT_LOGIN: ${{ inputs.bot-login }}
        CONFIG_PATH: ${{ inputs.config-path }}
        CHECKLIST_REPO: ${{ inputs.checklist-repo }}
        CHECKLIST_REF: ${{ inputs.checklist-ref }}
      with:
        github-token: ${{ inputs.github-token }}
        script: |
          const run = require(`${process.env.ACTION_PATH}/src/main.js`);
          await run({ github, context, core });
