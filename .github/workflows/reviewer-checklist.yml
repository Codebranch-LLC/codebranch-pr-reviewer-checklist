# Reusable workflow. Other repositories call it; see README.md.
name: Reviewer checklist

on:
  workflow_call:
    inputs:
      reset-on-push:
        description: Reset the checklist to unticked whenever new commits are pushed.
        type: boolean
        default: false

permissions: {}

jobs:
  checklist:
    # Only PR events, and only edits or deletions of the checklist comment itself.
    if: >-
      github.event_name == 'pull_request_target' ||
      (github.event_name == 'issue_comment' &&
       github.event.issue.pull_request &&
       github.event.comment.user.login == 'github-actions[bot]')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    concurrency:
      group: reviewer-checklist-${{ github.repository }}-${{ github.event.pull_request.number || github.event.issue.number }}
      cancel-in-progress: false
    permissions:
      issues: write
      pull-requests: write
      statuses: write
    steps:
      - uses: Codebranch-LLC/codebranch-pr-reviewer-checklist@v1
        with:
          reset-on-push: ${{ inputs.reset-on-push }}
